# 用 $host 而不是写死 IP，换个地址访问也能正确跳转
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;
    charset utf-8;
    server_name _;

    location = /term  { return 302 http://$host:7681/; }
    location = /tty   { return 302 http://$host:7681/; }
    location = /repo  { return 302 http://$host:8080/; }
    location = /files { return 302 http://$host:8080/; }

    location / {
        try_files $uri $uri/ =404;
    }

    autoindex off;
}
